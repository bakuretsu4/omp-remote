name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: bridge
      # The bridge embeds the relay and imports its source, so the relay's dependencies must be installed too.
      - run: npm ci
        working-directory: relay
      - run: npm run typecheck
        working-directory: bridge
      - run: npm test
        working-directory: bridge

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK with licenses accepted; Gradle fetches anything missing.
      - uses: gradle/actions/setup-gradle@v4
      # An unsigned release build proves R8/shrinking still works without needing any secret.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
